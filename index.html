<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1e263b"><meta name="description" content="Two little ghosts, one magical reflection. Guide Luna and Rose home together in twelve original mirror puzzles."><title>Moonlit Mirrors · Midnight Candy Club</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="night-sky" aria-hidden="true"><i></i><i></i><i></i></div><header><div class="brand"><span>☾</span><p>MIDNIGHT<br>CANDY CLUB</p></div><div class="heading"><p id="eyebrow">TWO SOULS. ONE LITTLE ADVENTURE.</p><h1 id="game-title">Meet me <em>in the mirror.</em></h1></div><nav><button id="sound" aria-label="Enable sound">♪</button><button id="help" aria-label="How to play">?</button><button id="language" class="language">中文</button></nav></header>
<main><div class="room-toolbar"><select id="level-select" aria-label="Choose a room"></select><div class="key-state" id="key-state"></div><div class="move-counter"><strong id="moves">0</strong><span id="moves-label">MOVES</span></div><div class="par-counter"><span id="par-label">PERFECT</span><strong id="par">4</strong></div></div>
<section class="play-area"><div class="rooms"><div class="room left-room"><div class="room-name"><span class="dot"></span><span>LUNA</span><span id="left-ready"></span></div><div class="room-window"><div class="board" id="left-board" role="grid" aria-label="Luna’s room"></div></div></div><div class="reflection"><span class="reflection-star">✦</span><div class="mirror-line"></div><button id="phase" class="phase" aria-label="Turn the mirror"><span id="phase-icon">⇆</span><small id="phase-label">MIRROR</small></button><div class="mirror-line"></div><span class="reflection-heart">♡</span></div><div class="room right-room"><div class="room-name"><span class="dot"></span><span>ROSE</span><span id="right-ready"></span></div><div class="room-window"><div class="board" id="right-board" role="grid" aria-label="Rose’s room"></div></div></div></div>
<div class="status-row"><p id="status" role="status" aria-live="polite"></p></div></section>
<div class="controls"><div class="tools"><button id="undo"><span>↶</span><small id="undo-label">Undo</small></button><button id="hint"><span>◇</span><small id="hint-label">Hint</small></button><button id="restart"><span>↻</span><small id="restart-label">Restart</small></button></div><div class="dpad" aria-label="Move both ghosts"><button data-move="left" aria-label="Move left">←</button><button data-move="up" aria-label="Move up">↑</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button></div><div class="control-note" id="control-note">ARROWS / WASD<br><span>Z UNDO · H HINT</span></div></div>
<div class="journey" id="journey" aria-label="Twelve moonlit rooms"></div><footer><span id="footer-copy">Even a reflection needs a friend.</span><span id="progress">0 / 36 STARS</span></footer></main>
<dialog id="help-dialog"><button class="close" data-close="help-dialog" aria-label="Close">×</button><p class="eyebrow" id="help-kicker">A LITTLE MIRROR MAGIC</p><h2 id="help-title">Find your way together.</h2><div id="help-copy"></div><button class="primary" data-close="help-dialog" id="help-play">Let’s go</button></dialog>
<dialog id="win-dialog"><button class="close" data-close="win-dialog" aria-label="Close">×</button><div class="win-art" id="win-art"></div><p class="eyebrow" id="win-kicker"></p><h2 id="win-title"></h2><div id="win-stars" class="stars"></div><p id="win-copy"></p><button id="next" class="primary"></button><button id="share" class="secondary"></button><p id="share-status"></p></dialog>
<script type="module" src="app.js"></script></body></html>
